# Capability tokens appear in media and share URL paths. Log the route class,
# omit all query strings, and never copy a Referer into the access log.
map $uri $vault_normalized_log_target {
    default $uri;
    ~^/cloud-api/public/secure-sends/ /cloud-api/public/secure-sends/[redacted];
}

map $request_uri $vault_log_target {
    default $vault_normalized_log_target;
    ~^/api/media/stream/[^/?]+ /api/media/stream/[redacted];
    ~^/s/[^/?]+ /s/[redacted];
}

log_format vault_redacted '$remote_addr - $remote_user [$time_local] '
                          '"$request_method $vault_log_target $server_protocol" '
                          '$status $body_bytes_sent $request_time "$http_user_agent"';

# Public share host. Only what a share recipient needs is routed here: the
# landing page, the assets it loads, and the unauthenticated share endpoints.
# Everything else answers 404, so the application itself stays reachable over
# the private network only. This block must stay ahead of the catch-all server.
server {
    access_log /var/log/nginx/access.log vault_redacted;
    listen 80;
    server_name ${SHARE_HOST};

    root /usr/share/nginx/html;

    # Share landing page; the SPA resolves the token client side.
    location ~ ^/s/[^/]+/?$ {
        # nginx error lines include the unsanitized request URI.
        error_log /dev/null crit;
        try_files /index.html =404;
    }

    # Share endpoints that need no session. Note the trailing /public/ on both
    # sides: nothing outside it can be reached through this host.
    location /cloud-api/public/ {
        proxy_pass http://cloud-page-backend:8090/api/public/;
        proxy_http_version 1.1;
        # A shared folder is zipped while it is sent. Give it room, and hand the
        # bytes straight to the recipient: buffering would write the whole
        # archive to disk here first, which for a large folder means gigabytes of
        # extra writes before the download even starts.
        proxy_read_timeout 3600s;
        proxy_max_temp_file_size 0;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /cloud-api/public/secure-sends/ {
            # Upstream errors include the unsanitized request URI.
            error_log /dev/null crit;
            proxy_pass http://cloud-page-backend:8090/api/public/secure-sends/;
        }
    }

    # Static bundle files only. No SPA fallback, so unknown paths stay 404
    # instead of silently rendering the application shell.
    location / {
        try_files $uri =404;
    }
}

# Everything that is not the public share host. Marked default_server so it
# keeps serving unmatched hostnames regardless of block order in this file.
server {
    access_log /var/log/nginx/access.log vault_redacted;
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Angular SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Core API
    location /api/media/stream/ {
        # A failed upstream connection otherwise logs the bearer token verbatim.
        # The sanitized access log still records the status for diagnosis.
        error_log /dev/null crit;
        proxy_pass http://vault-web-backend:8080/api/media/stream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://vault-web-backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cloud API
    location /cloud-api/ {
        client_max_body_size 500M;
        proxy_read_timeout 3600s;
        # Folder downloads are zipped on the fly; pass them through instead of
        # spooling the whole archive to disk here first.
        proxy_max_temp_file_size 0;
        proxy_pass http://cloud-page-backend:8090/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /cloud-api/public/secure-sends/ {
            error_log /dev/null crit;
            proxy_pass http://cloud-page-backend:8090/api/public/secure-sends/;
        }
    }

    # Profile pictures served from the backend uploads volume
    location /uploads/profile-pictures/ {
        proxy_pass http://vault-web-backend:8080/uploads/profile-pictures/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Server docs (Markdown/raw files directory listing)
    location /docs/ {
        proxy_pass http://server-docs/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket for private/group chat
    location /ws-chat {
        proxy_pass http://vault-web-backend:8080/ws-chat;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
