name: Deploy CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate Compose configuration
        run: docker compose -f docker-compose.deploy.yml config --no-interpolate > /dev/null

      - name: Check shell syntax
        run: |
          for script in scripts/*.sh scripts/tests/*.sh; do
            bash -n "$script"
          done

      - name: Test admin port safeguards
        run: python3 -m unittest discover -s scripts/tests -p test_admin_ports.py

      - name: Test nginx share and portal routes
        run: bash scripts/tests/share_proxy.sh

      - name: Test backup and restore scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync
          bash scripts/tests/backups.sh

  smoke:
    name: Compose smoke through nginx
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Build and exercise the pinned Compose stack
        run: bash scripts/tests/compose_smoke.sh
